<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title> LETS SOPT WEB 1주차 과제</title>
        <link rel="stylesheet" href="styles/theme.css" />
        <link rel="stylesheet" href="styles/style.css" />
    </head>
    <body>
        <header>
            <div class="header_profile">
                <img src="./images/header_profile.png" alt="헤더 프로필 사진" class="image_profile" />
            </div>
            <div class="header_title">
                <h1> 채원이의 블로그 </h1>
                <p> 환영합니다 </p>
            </div>
            <div class="header_icon">
                <img src="./images/header_github.png" alt="헤더 깃허브 아이콘" class="image_github"/>
            </div>
        </header>

        <main class="main-container">
            <nav class="side-nav">
                <ul>
                    <li><a href="#photo-dump"> 포토덤프</a></li>
                    <li><a href="#photo-like"> 좋아하는 것</a></li>
                    <li><a href="#interests"> 관심사</a></li>
                    <li><a href="#to-web"> To 웹왔니</a></li>
                </ul>
            </nav>
            <div class="content">
                <section id="photo-dump">
                    <h2>📸 포토덤프 </h2>
                    <div class="photo-grid">
                        <div class="photo-small">
                            <img src="./images/photodump_1.png">
                        </div>
                        <div class="photo-small">
                            <img src="./images/photodump_2.png">
                        </div>
                            <div class="photo-medium">
                            <img src="./images/photodump_3.png">
                        </div>
                            <div class="photo-big">
                            <img src="./images/photodump_4.png">
                        </div>
                        <div class="photo-small">
                            <img src="./images/photodump_5.png">
                        </div>
                            <div class="photo-small">
                            <img src="./images/photodump_6.png">
                        </div>
                    </div>
                </section>
                <section id="photo-like">
                    <h2> 📷 좋아하는 것: 머핀이</h2>
                    <div class="photo-scroll">
                        <img src="./images/photolike_1.png">
                        <img src="./images/photolike_2.png">
                        <img src="./images/photolike_3.png">
                        <img src="./images/photolike_4.png">
                        <img src="./images/photolike_5.png">
                        <img src="./images/photolike_6.png">
                        <img src="./images/photolike_7.png">
                        <img src="./images/photolike_8.png">
                        <img src="./images/photolike_9.png">
                    </div>
                </section>
                <section id="interests">
                    <h2> 😎 내 관심사 </h2>
                    <ul class="card-container">
                        <li class="card">
                            <img src="./images/interests_1.png" class="card-thumbnail" alt="야구"/>
                            <h4> 💜 야구 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_2.png" class="card-thumbnail" alt="시와 산책"/>
                            <h4> 💜 시와 산책 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_3.png" class="card-thumbnail" alt="락페"/>
                            <h4> 💜 락페 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_4.png" class="card-thumbnail" alt="주토피아"/>
                            <h4> 💜 주토피아 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_5.png" class="card-thumbnail" alt="육회"/>
                            <h4> 💜 육회 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_6.png" class="card-thumbnail" alt="우즈"/>
                            <h4> 💜 우즈 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_7.png" class="card-thumbnail" alt="햄스터"/>
                            <h4> 💜 햄스터 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                        <li class="card">
                            <img src="./images/interests_8.png" class="card-thumbnail" alt="연프"/>
                            <h4> 💜 연프 </h4>
                            <div class="card-button">
                                <button class="btn-like"> 좋아요 </button>
                                <button class="btn-dislike"> 싫어요 </button>
                            </div>
                        </li>
                    </ul>
                </section>
                <section id="to-web">
                    <h2> To. 우리집에 웹왔니 </h2>
                    <div class="notice">
                        <p class="notice-item"> 웨비들 잘 부탁해요 </p>
                        <p class="notice-item"> 화이팅!!! </p>
                    </div>
                </section>
            </div>
        </main>
        <footer class="footer">
            <h4> 읽어주셔서 감사합니다 </h4>
        </footer>
    </body>

</html>
